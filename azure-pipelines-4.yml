# ============================================================
# STAGE 4 - TERRAFORM PLAN
# Calculates proposed infrastructure changes without applying.
# Publishes the saved plan for approval and later deployment.
# ============================================================

  - stage: plan
    displayName: 'Stage 4 | Terraform Plan'
    dependsOn: CostAnalysis_Infracost
    condition: succeeded()

    jobs:
      - job: TerraformPlan
        displayName: '4.1 | Terraform Plan'
        pool:
          name: varisen-agent

        steps:
          - checkout: self

          - task: TerraformTask@5
            displayName: '4.1.1 | Terraform Init'
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          - task: TerraformTask@5
            displayName: '4.1.2 | Terraform Plan'
            inputs:
              provider: azurerm
              command: plan
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-out="$(Build.ArtifactStagingDirectory)\tfplan"'

          # Stores the exact plan file for the approval/apply stages
          - task: PublishPipelineArtifact@1
            displayName: '4.1.3 | Publish Reviewed Plan'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)\tfplan'
              artifact: terraform-plan
              publishLocation: pipeline

# ============================================================
# STAGE 5 - MANUAL APPROVAL
# Pauses main-branch deployment until a reviewer approves.
# ============================================================

  - stage: MANUALVALIDATION
    displayName: 'Stage 5 | Manual Approval'
    dependsOn: plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - job: ManualApproval
        displayName: '5.1 | Awaiting Approval'
        pool: server  # Runs on Azure DevOps server, not the agent
        timeoutInMinutes: 1440

        steps:
          - task: ManualValidation@1
            displayName: '5.1.1 | Manual Validation'
            timeoutInMinutes: 720
            inputs:
              notifyUsers: 'pradum@varisen.com'
              instructions: |
                Review the pipeline before approving:

                1. Confirm security scan results.
                2. Review the Infracost estimate.
                3. Review the Terraform plan artifact.
                4. Confirm no unexpected resource deletions.
                5. Verify the target environment and backend state.

                Approve only after all checks pass.
              onTimeout: reject

# ============================================================
# STAGE 6 - TERRAFORM APPLY
# Main branch + approval required.
# Applies the previously saved Terraform plan.
# ============================================================

  - stage: apply
    displayName: 'Stage 6 | Terraform Apply'
    dependsOn: MANUALVALIDATION
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    jobs:
      - job: TerraformApply
        displayName: '6.1 | Apply Approved Plan'
        pool:
          name: varisen-agent

        steps:
          - checkout: self

          # Downloads the plan reviewed in Stage 4
          - task: DownloadPipelineArtifact@2
            displayName: '6.1.1 | Download Approved Plan'
            inputs:
              buildType: current
              artifactName: terraform-plan
              targetPath: '$(Pipeline.Workspace)\terraform-plan'

          - task: TerraformTask@5
            displayName: '6.1.2 | Terraform Init'
            inputs:
              provider: azurerm
              command: init
              workingDirectory: '$(terraformWorkingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(backendResourceGroup)'
              backendAzureRmStorageAccountName: '$(backendStorageAccount)'
              backendAzureRmContainerName: '$(backendContainer)'
              backendAzureRmKey: '$(backendKey)'

          # Applies the saved plan instead of generating a new one
          - task: TerraformTask@5
            displayName: '6.1.3 | Terraform Apply Approved Plan'
            inputs:
              provider: azurerm
              command: apply
              workingDirectory: '$(terraformWorkingDirectory)'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '"$(Pipeline.Workspace)\terraform-plan\tfplan"'
